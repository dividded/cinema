# Validates the Cloudflare Worker on every push and deploys it from main.
# Deploying needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets;
# without them the deploy job is skipped.
name: Cloudflare Worker

on:
  push:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/check-worker.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/check-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cloudflare-worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'cloudflare-worker/yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Validate wrangler config and bundle
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Lint scripts
        run: bash -n scripts/refresh-and-verify.sh

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'cloudflare-worker/yarn.lock'

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: yarn install --frozen-lockfile

      - name: Deploy, then refresh and verify the data
        if: steps.creds.outputs.ready == 'true'
        run: yarn deploy
