name = "cinema-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Create the namespace: npx wrangler kv namespace create MOVIES_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "MOVIES_KV"
id = "7b38c01b510b4a198228b11ed83a5a64"

[vars]
MOVIES_KV_KEY = "cinemathequeMovies"
REFRESH_URL = "https://cinema-mu-ten.vercel.app/api/movies/cinematheque/refresh"

# Refresh the movie data twice a day (UTC). Deploying replaces any
# schedules set in the dashboard, so this file is the source of truth.
[triggers]
crons = ["17 3,15 * * *"]

[observability]
enabled = true
